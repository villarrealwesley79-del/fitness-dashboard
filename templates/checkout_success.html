<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — FitOS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d1117; --bg2: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --green-bg: #238636; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px 40px; max-width: 440px; width: 100%; text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    a {
      display: inline-block; background: var(--green-bg); color: #fff;
      padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🎉</div>
    <h1>Payment Successful!</h1>
    <p>Your Pro account is now active. Enjoy unlimited data, multi-user access, and priority support.</p>
    <a href="/">Go to Dashboard</a>
  </div>
</body>
</html>
